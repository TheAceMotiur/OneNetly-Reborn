name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build production release
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts
          npm ci --no-audit --no-fund
          npm run build

      # Only files that differ from the last deploy are uploaded, and nothing
      # on the server is deleted: .env, storage uploads and the install lock
      # only exist there. server-dir must keep its trailing slash.
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_HOST || '146.103.57.218' }}
          username: ${{ secrets.FTP_USER || 'TheAceMotiur' }}
          password: ${{ secrets.FTP_PASSWORD || 'AmiMotiur27@' }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_DIR || '/home/TheAceMotiur/web/onenetly.com/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.freebuff/**
            **/node_modules/**
            **/.env*
            **/bootstrap/cache/*.php
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/database/*.sqlite
            **/public/hot
            **/public/storage
